services:
  - type: web
    name: nexo-dashboard-pro
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: BIND_IP
        value: 0.0.0.0
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ROOT_DIR
        value: /opt/render/project/src
      - key: DATABASE_URL
        sync: false  # Set this in Render dashboard after creating Neon DB
